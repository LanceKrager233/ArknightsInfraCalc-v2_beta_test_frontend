name: Deploy verified branch

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      DEPLOYMENT_ENV: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      DEPLOY_SHA: ${{ github.sha }}
      DEPLOY_PREVIOUS_SHA: ${{ github.event.before }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      DEPLOY_APP_ROOT: ${{ vars.DEPLOY_APP_ROOT }}
      DEPLOY_SERVICE: ${{ vars.DEPLOY_SERVICE }}
      DEPLOY_RUN_USER: ${{ vars.DEPLOY_RUN_USER || 'arkinfra' }}
      DEPLOY_INTERNAL_PORT: ${{ vars.DEPLOY_INTERNAL_PORT }}
      DEPLOY_PUBLIC_HEALTH_URL: ${{ vars.DEPLOY_PUBLIC_HEALTH_URL }}
      DEPLOY_DEBUG_TOOLS_ENABLED: ${{ vars.DEPLOY_DEBUG_TOOLS_ENABLED || '0' }}
      DEPLOY_RATE_LIMIT_ENABLED: ${{ vars.DEPLOY_RATE_LIMIT_ENABLED || '1' }}

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_USER"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$DEPLOY_SSH_USER" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "$DEPLOY_APP_ROOT" =~ ^/opt/arknights-infra(-[A-Za-z0-9._-]+)?$ ]]
          [[ "$DEPLOY_SERVICE" =~ ^arknights-infra(-[A-Za-z0-9_.@-]+)?$ ]]
          [[ "$DEPLOY_RUN_USER" =~ ^[A-Za-z0-9_-]+$ ]]
          test "$DEPLOY_RUN_USER" != "root"
          [[ "$DEPLOY_INTERNAL_PORT" =~ ^[0-9]{2,5}$ ]]
          [[ "$DEPLOY_PREVIOUS_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_DEBUG_TOOLS_ENABLED" =~ ^[01]$ ]]
          [[ "$DEPLOY_RATE_LIMIT_ENABLED" =~ ^[01]$ ]]
          if [[ "$DEPLOYMENT_ENV" == "production" ]]; then
            test "$DEPLOY_APP_ROOT" = "/opt/arknights-infra"
            test "$DEPLOY_SERVICE" = "arknights-infra"
          else
            [[ "$DEPLOY_APP_ROOT" =~ ^/opt/arknights-infra-[A-Za-z0-9._-]+$ ]]
            [[ "$DEPLOY_SERVICE" =~ ^arknights-infra-[A-Za-z0-9_.@-]+$ ]]
          fi
          if [[ -n "$DEPLOY_PUBLIC_HEALTH_URL" ]]; then
            public_health_url_pattern='^https?://[A-Za-z0-9._:/?&=%-]+$'
            [[ "$DEPLOY_PUBLIC_HEALTH_URL" =~ $public_health_url_pattern ]]
          fi

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Prepare or upload release archive
        shell: bash
        run: |
          set -euo pipefail
          prepare_started_at="$(date +%s)"
          prepare_script_sha256="$(sha256sum scripts/prepare-release.sh | cut -d ' ' -f 1)"
          deploy_tree_sha="$(git rev-parse 'HEAD^{tree}')"
          remote_archive="/tmp/arknights-infra-${DEPLOYMENT_ENV}-${DEPLOY_SHA}.tar.gz"
          remote_bundle="/tmp/arknights-infra-${DEPLOYMENT_ENV}-${DEPLOY_SHA}.bundle"
          local_bundle="release-${DEPLOY_SHA}.bundle"
          ssh_options=(
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o ConnectionAttempts=2
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
          )

          run_remote_prepare() {
            local bundle_path="${1:-}"
            local remote_command="/usr/local/sbin/arknights-infra-prepare-release \
              '$DEPLOYMENT_ENV' \
              '$DEPLOY_SHA' \
              '$deploy_tree_sha' \
              '$remote_archive' \
              '$prepare_script_sha256'"
            if [[ -n "$bundle_path" ]]; then
              remote_command+=" '$bundle_path'"
            fi
            timeout --kill-after=10s 90s ssh "${ssh_options[@]}" \
              "${DEPLOY_SSH_USER}@${DEPLOY_HOST}" \
              "$remote_command"
          }

          is_temporary_failure() {
            [[ "$1" -eq 75 || "$1" -eq 124 || "$1" -eq 137 ]]
          }

          set +e
          run_remote_prepare
          prepare_status=$?
          set -e

          transport_mode="git-cache"
          fallback_reason="none"
          bundle_base_source="not-needed"
          transfer_bytes=0
          release_prepared=0
          if [[ "$prepare_status" -eq 0 ]]; then
            release_prepared=1
          elif ! is_temporary_failure "$prepare_status"; then
            echo "Release preparation failed with non-recoverable status $prepare_status." >&2
            exit "$prepare_status"
          else
            fallback_reason="temporary-cache-or-github-failure"
          fi

          if [[ "$release_prepared" -eq 0 ]]; then
            bundle_ready=0
            bundle_base_sha=""
            bundle_base_source="none"
            remote_cache_base="$(timeout --kill-after=5s 30s ssh "${ssh_options[@]}" \
              "${DEPLOY_SSH_USER}@${DEPLOY_HOST}" \
              "git --git-dir=/var/cache/arknights-infra-deploy/repository.git rev-parse 'refs/arknights-infra/environments/$DEPLOYMENT_ENV'" \
              2>/dev/null || true)"
            if [[ "$remote_cache_base" =~ ^[0-9a-f]{40}$ ]] \
              && [[ "$remote_cache_base" != "$DEPLOY_SHA" ]] \
              && git cat-file -e "${remote_cache_base}^{commit}" \
              && git merge-base --is-ancestor "$remote_cache_base" HEAD; then
              bundle_base_sha="$remote_cache_base"
              bundle_base_source="server-cache"
            elif [[ "$DEPLOY_PREVIOUS_SHA" != "0000000000000000000000000000000000000000" ]] \
              && git cat-file -e "${DEPLOY_PREVIOUS_SHA}^{commit}" \
              && git merge-base --is-ancestor "$DEPLOY_PREVIOUS_SHA" HEAD; then
              bundle_base_sha="$DEPLOY_PREVIOUS_SHA"
              bundle_base_source="previous-push"
            fi

            if [[ -n "$bundle_base_sha" ]]; then
              if git bundle create "$local_bundle" HEAD "^$bundle_base_sha"; then
                bundle_ready=1
              else
                fallback_reason="incremental-bundle-create-failed"
              fi
            else
              fallback_reason="incremental-base-unavailable"
            fi

            if [[ "$bundle_ready" -eq 1 ]]; then
              bundle_bytes="$(stat -c '%s' "$local_bundle")"
              set +e
              timeout --kill-after=10s 1500s scp "${ssh_options[@]}" \
                "$local_bundle" \
                "${DEPLOY_SSH_USER}@${DEPLOY_HOST}:$remote_bundle"
              bundle_transfer_status=$?
              set -e

              if [[ "$bundle_transfer_status" -eq 0 ]]; then
                transfer_bytes="$(( transfer_bytes + bundle_bytes ))"
                set +e
                run_remote_prepare "$remote_bundle"
                bundle_prepare_status=$?
                set -e
                if [[ "$bundle_prepare_status" -eq 0 ]]; then
                  transport_mode="git-bundle"
                  transfer_bytes="$bundle_bytes"
                  release_prepared=1
                elif is_temporary_failure "$bundle_prepare_status"; then
                  fallback_reason="incremental-bundle-incomplete"
                else
                  echo "Incremental bundle failed validation with status $bundle_prepare_status." >&2
                  exit "$bundle_prepare_status"
                fi
              else
                fallback_reason="incremental-bundle-transfer-failed"
                timeout --kill-after=5s 30s ssh "${ssh_options[@]}" \
                  "${DEPLOY_SSH_USER}@${DEPLOY_HOST}" \
                  "rm -f -- '$remote_bundle'" || true
              fi
            fi
          fi

          if [[ "$release_prepared" -eq 0 ]]; then
            transport_mode="scp-archive"
            git archive --format=tar.gz --output="release-${DEPLOY_SHA}.tar.gz" HEAD
            archive_transfer_bytes="$(stat -c '%s' "release-${DEPLOY_SHA}.tar.gz")"
            transfer_bytes="$(( transfer_bytes + archive_transfer_bytes ))"
            timeout --kill-after=10s 1500s scp "${ssh_options[@]}" \
              "release-${DEPLOY_SHA}.tar.gz" \
              "${DEPLOY_SSH_USER}@${DEPLOY_HOST}:$remote_archive"
          fi

          archive_bytes="$(timeout --kill-after=5s 30s ssh "${ssh_options[@]}" \
            "${DEPLOY_SSH_USER}@${DEPLOY_HOST}" "stat -c '%s' '$remote_archive'")"
          prepare_elapsed_seconds="$(( $(date +%s) - prepare_started_at ))"
          {
            echo "### Release transport"
            echo
            echo "| Environment | SHA | Mode | Bundle base | Seconds | Transferred bytes | Archive bytes | Fallback reason |"
            echo "| --- | --- | --- | --- | ---: | ---: | ---: | --- |"
            echo "| $DEPLOYMENT_ENV | \`${DEPLOY_SHA:0:12}\` | $transport_mode | $bundle_base_source | $prepare_elapsed_seconds | $transfer_bytes | $archive_bytes | $fallback_reason |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy and verify
        shell: bash
        run: |
          set -euo pipefail
          deploy_script_sha256="$(sha256sum scripts/deploy-release.sh | cut -d ' ' -f 1)"
          ssh -o BatchMode=yes "${DEPLOY_SSH_USER}@${DEPLOY_HOST}" \
            "sudo -n /usr/local/sbin/arknights-infra-deploy \
            '$DEPLOYMENT_ENV' \
            '$DEPLOY_SHA' \
            '/tmp/arknights-infra-${DEPLOYMENT_ENV}-${DEPLOY_SHA}.tar.gz' \
            '$DEPLOY_APP_ROOT' \
            '$DEPLOY_SERVICE' \
            '$DEPLOY_RUN_USER' \
            '$DEPLOY_INTERNAL_PORT' \
            '$DEPLOY_PUBLIC_HEALTH_URL' \
            '$DEPLOY_DEBUG_TOOLS_ENABLED' \
            '$DEPLOY_RATE_LIMIT_ENABLED' \
            '$deploy_script_sha256'"
