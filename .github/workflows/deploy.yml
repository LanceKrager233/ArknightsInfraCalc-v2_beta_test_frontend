name: Deploy verified branch

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    concurrency:
      group: deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      DEPLOYMENT_ENV: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      DEPLOY_SHA: ${{ github.sha }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      DEPLOY_APP_ROOT: ${{ vars.DEPLOY_APP_ROOT }}
      DEPLOY_SERVICE: ${{ vars.DEPLOY_SERVICE }}
      DEPLOY_RUN_USER: ${{ vars.DEPLOY_RUN_USER || 'arkinfra' }}
      DEPLOY_INTERNAL_PORT: ${{ vars.DEPLOY_INTERNAL_PORT }}
      DEPLOY_PUBLIC_HEALTH_URL: ${{ vars.DEPLOY_PUBLIC_HEALTH_URL }}
      DEPLOY_DEBUG_TOOLS_ENABLED: ${{ vars.DEPLOY_DEBUG_TOOLS_ENABLED || '0' }}
      DEPLOY_RATE_LIMIT_ENABLED: ${{ vars.DEPLOY_RATE_LIMIT_ENABLED || '1' }}

    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_USER"
          test -n "$DEPLOY_SSH_PRIVATE_KEY"
          test -n "$DEPLOY_SSH_KNOWN_HOSTS"
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9._-]+$ ]]
          [[ "$DEPLOY_SSH_USER" =~ ^[A-Za-z0-9_-]+$ ]]
          [[ "$DEPLOY_APP_ROOT" =~ ^/opt/arknights-infra(-[A-Za-z0-9._-]+)?$ ]]
          [[ "$DEPLOY_SERVICE" =~ ^arknights-infra(-[A-Za-z0-9_.@-]+)?$ ]]
          [[ "$DEPLOY_RUN_USER" =~ ^[A-Za-z0-9_-]+$ ]]
          test "$DEPLOY_RUN_USER" != "root"
          [[ "$DEPLOY_INTERNAL_PORT" =~ ^[0-9]{2,5}$ ]]
          [[ "$DEPLOY_DEBUG_TOOLS_ENABLED" =~ ^[01]$ ]]
          [[ "$DEPLOY_RATE_LIMIT_ENABLED" =~ ^[01]$ ]]
          if [[ "$DEPLOYMENT_ENV" == "production" ]]; then
            test "$DEPLOY_APP_ROOT" = "/opt/arknights-infra"
            test "$DEPLOY_SERVICE" = "arknights-infra"
          else
            [[ "$DEPLOY_APP_ROOT" =~ ^/opt/arknights-infra-[A-Za-z0-9._-]+$ ]]
            [[ "$DEPLOY_SERVICE" =~ ^arknights-infra-[A-Za-z0-9_.@-]+$ ]]
          fi
          if [[ -n "$DEPLOY_PUBLIC_HEALTH_URL" ]]; then
            public_health_url_pattern='^https?://[A-Za-z0-9._:/?&=%-]+$'
            [[ "$DEPLOY_PUBLIC_HEALTH_URL" =~ $public_health_url_pattern ]]
          fi

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Prepare or upload release archive
        shell: bash
        run: |
          set -euo pipefail
          prepare_started_at="$(date +%s)"
          prepare_script_sha256="$(sha256sum scripts/prepare-release.sh | cut -d ' ' -f 1)"
          deploy_tree_sha="$(git rev-parse 'HEAD^{tree}')"
          remote_archive="/tmp/arknights-infra-${DEPLOYMENT_ENV}-${DEPLOY_SHA}.tar.gz"

          set +e
          ssh -o BatchMode=yes "${DEPLOY_SSH_USER}@${DEPLOY_HOST}" \
            "/usr/local/sbin/arknights-infra-prepare-release \
            '$DEPLOYMENT_ENV' \
            '$DEPLOY_SHA' \
            '$deploy_tree_sha' \
            '$remote_archive' \
            '$prepare_script_sha256'"
          prepare_status=$?
          set -e

          transport_mode="git-cache"
          fallback_reason="none"
          if [[ "$prepare_status" -eq 75 ]]; then
            transport_mode="scp-fallback"
            fallback_reason="temporary-cache-or-github-failure"
            git archive --format=tar.gz --output="release-${DEPLOY_SHA}.tar.gz" HEAD
            scp -o BatchMode=yes \
              -o ServerAliveInterval=30 \
              -o ServerAliveCountMax=6 \
              "release-${DEPLOY_SHA}.tar.gz" \
              "${DEPLOY_SSH_USER}@${DEPLOY_HOST}:$remote_archive"
          elif [[ "$prepare_status" -ne 0 ]]; then
            echo "Release preparation failed with non-recoverable status $prepare_status." >&2
            exit "$prepare_status"
          fi

          archive_bytes="$(ssh -o BatchMode=yes "${DEPLOY_SSH_USER}@${DEPLOY_HOST}" "stat -c '%s' '$remote_archive'")"
          prepare_elapsed_seconds="$(( $(date +%s) - prepare_started_at ))"
          {
            echo "### Release transport"
            echo
            echo "| Environment | SHA | Mode | Seconds | Archive bytes | Fallback reason |"
            echo "| --- | --- | --- | ---: | ---: | --- |"
            echo "| $DEPLOYMENT_ENV | \`${DEPLOY_SHA:0:12}\` | $transport_mode | $prepare_elapsed_seconds | $archive_bytes | $fallback_reason |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy and verify
        shell: bash
        run: |
          set -euo pipefail
          deploy_script_sha256="$(sha256sum scripts/deploy-release.sh | cut -d ' ' -f 1)"
          ssh -o BatchMode=yes "${DEPLOY_SSH_USER}@${DEPLOY_HOST}" \
            "sudo -n /usr/local/sbin/arknights-infra-deploy \
            '$DEPLOYMENT_ENV' \
            '$DEPLOY_SHA' \
            '/tmp/arknights-infra-${DEPLOYMENT_ENV}-${DEPLOY_SHA}.tar.gz' \
            '$DEPLOY_APP_ROOT' \
            '$DEPLOY_SERVICE' \
            '$DEPLOY_RUN_USER' \
            '$DEPLOY_INTERNAL_PORT' \
            '$DEPLOY_PUBLIC_HEALTH_URL' \
            '$DEPLOY_DEBUG_TOOLS_ENABLED' \
            '$DEPLOY_RATE_LIMIT_ENABLED' \
            '$deploy_script_sha256'"
