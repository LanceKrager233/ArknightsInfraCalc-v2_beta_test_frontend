name: Frontend quality

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_DB: arknights_auth_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arknights_auth_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      BETA_DEBUG_TOOLS_ENABLED: "0"
      BETA_RATE_LIMIT_ENABLED: "0"
      BETA_TRUST_PROXY_HEADERS: "0"
      DATABASE_URL: postgresql://arknights_test_runtime:runtime-test-only@127.0.0.1:5432/arknights_auth_test
      DATABASE_MIGRATION_URL: postgresql://arknights_test_migration:migration-test-only@127.0.0.1:5432/arknights_auth_test
      AUTH_INTEGRATION_DATABASE_URL: postgresql://arknights_test_runtime:runtime-test-only@127.0.0.1:5432/arknights_auth_test
      BETTER_AUTH_SECRET: integration-test-secret-at-least-32-bytes-long
      BETTER_AUTH_URL: https://auth.integration.test
      RESEND_API_KEY: re_test_not_used
      AUTH_EMAIL_FROM: Authentication Test <auth@example.test>

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate database deployment files
        shell: bash
        run: |
          set -euo pipefail
          cp deploy/postgres/example.env deploy/postgres/production.env
          cp deploy/postgres/example.env deploy/postgres/development.env
          docker compose -f deploy/postgres/compose.yml config >/dev/null
          bash -n deploy/postgres/init-roles.sh deploy/postgres/backup.sh scripts/postgres-backup.test.sh
          rm -f deploy/postgres/production.env deploy/postgres/development.env

      - name: Initialize limited database roles
        run: |
          docker run --rm --network host \
            -v "$PWD/deploy/postgres/init-roles.sh:/init-roles.sh:ro" \
            -e PGHOST=127.0.0.1 \
            -e PGPORT=5432 \
            -e PGPASSWORD=postgres-test-only \
            -e POSTGRES_DB=arknights_auth_test \
            -e POSTGRES_USER=postgres \
            -e AUTH_RUNTIME_USER=arknights_test_runtime \
            -e AUTH_RUNTIME_PASSWORD=runtime-test-only \
            -e AUTH_MIGRATION_USER=arknights_test_migration \
            -e AUTH_MIGRATION_PASSWORD=migration-test-only \
            -e AUTH_BACKUP_USER=arknights_test_backup \
            -e AUTH_BACKUP_PASSWORD=backup-test-only \
            postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636 \
            sh /init-roles.sh

      - name: Verify committed database migrations
        run: |
          npm run db:generate
          git diff --exit-code -- drizzle

      - name: Apply committed authentication migrations
        run: npm run db:migrate

      - name: Authentication runtime readiness
        run: npm run auth:check

      - name: Verify limited database grants and backup access
        shell: bash
        run: |
          set -euo pipefail
          backup_url='postgresql://arknights_test_backup@127.0.0.1:5432/arknights_auth_test'
          runtime_url='postgresql://arknights_test_runtime@127.0.0.1:5432/arknights_auth_test'
          image='postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636'
          docker run --rm --network host -e PGPASSWORD=backup-test-only "$image" \
            psql "$backup_url" -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM drizzle.__drizzle_migrations;'
          if docker run --rm --network host -e PGPASSWORD=backup-test-only "$image" \
            psql "$backup_url" -v ON_ERROR_STOP=1 -c 'DELETE FROM "user" WHERE false;'; then
            echo 'backup role unexpectedly has write access' >&2
            exit 1
          fi
          if docker run --rm --network host -e PGPASSWORD=runtime-test-only "$image" \
            psql "$runtime_url" -v ON_ERROR_STOP=1 -c 'CREATE TABLE public.runtime_must_not_create (id integer);'; then
            echo 'runtime role unexpectedly has DDL access' >&2
            exit 1
          fi
          docker run --rm --network host \
            -e PGPASSWORD=backup-test-only \
            "$image" \
            pg_dump --format=custom --no-owner --no-acl "$backup_url" >/dev/null

      - name: PostgreSQL authentication integration
        run: npm run test:auth-integration

      - name: Security audit
        run: npm run audit:security

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: API contract tests
        run: npm run test:api-contract

      - name: Bundled solver contract smoke
        run: npm run test:solver-contract

      - name: Deployment script tests
        run: npm run test:deploy

      - name: Production build
        env:
          APP_DEPLOYMENT_ENV: production
          SKLAND_FEATURE_ENABLED: "0"
          DATABASE_URL: ""
          DATABASE_MIGRATION_URL: ""
          BETTER_AUTH_SECRET: ""
          BETTER_AUTH_URL: ""
          RESEND_API_KEY: ""
          AUTH_EMAIL_FROM: ""
        run: npm run build

      - name: Initial bundle budget
        run: npm run test:bundle-budget

      - name: Production output tracing
        run: npm run test:build-traces

      - name: Production client isolation
        run: npm run test:production-client

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Production profile isolation
        run: npm run test:e2e:production-profile

      - name: WebKit end-to-end tests
        run: npm run test:e2e:webkit

  deploy:
    needs: quality
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'develop')
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
